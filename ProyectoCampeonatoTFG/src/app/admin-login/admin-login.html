<section class="min-h-screen bg-[#06080f] flex items-center justify-center px-4 font-['Outfit',sans-serif] antialiased">
  <div class="w-full max-w-md">

    <!-- Logo / título -->
    <div class="text-center mb-8">
      <h1 class="font-['Bebas_Neue',sans-serif] text-white text-4xl tracking-wider uppercase">
        Panel <span class="text-[#e01c2e]">Admin</span>
      </h1>
      <p class="mt-2 text-sm text-[#8b95a3]">Acceso restringido a administradores</p>
    </div>

    <!-- Card -->
    <div class="bg-[#0d1117] border border-white/[0.07] border-t-2 border-t-[#e01c2e] rounded-2xl p-8 shadow-2xl">

      @if (error()) {
        <div class="bg-[#1a0a0a] border border-[#e01c2e]/40 text-[#e01c2e] text-sm px-4 py-3 rounded-xl mb-6">
          {{ error() }}
        </div>
      }

      <!-- DNI -->
      <div class="mb-4">
        <label class="block text-[10px] font-bold uppercase tracking-[0.14em] text-[#4b5563] mb-1.5">DNI</label>
        <input type="text" [value]="dni()" (input)="dni.set($any($event.target).value.toUpperCase())" (keydown.enter)="submit()" maxlength="9"
               class="w-full bg-[#141a24] border border-white/[0.07] rounded-lg px-4 py-2.5 text-[13.5px] text-[#eef0f4] placeholder-[#4b5563] outline-none transition-all focus:border-[#e01c2e] uppercase" />
      </div>

      <!-- Contraseña -->
      <div class="mb-6">
        <label class="block text-[10px] font-bold uppercase tracking-[0.14em] text-[#4b5563] mb-1.5">Contraseña</label>
        <div class="relative">
          <input [type]="showPass() ? 'text' : 'password'" [value]="password()" (input)="password.set($any($event.target).value)" (keydown.enter)="submit()"
                 class="w-full bg-[#141a24] border border-white/[0.07] rounded-lg pl-4 pr-10 py-2.5 text-[13.5px] text-[#eef0f4] placeholder-[#4b5563] outline-none transition-all focus:border-[#e01c2e]" />

          <button type="button" (click)="showPass.set(!showPass())" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#4b5563] hover:text-[#8b95a3] transition-colors">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              @if (showPass()) {
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/>
              } @else {
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              }
            </svg>
          </button>
        </div>
      </div>

      <!-- Botón de Entrar -->
      <button (click)="submit()" [disabled]="loading()"
              class="w-full flex items-center justify-center gap-2 bg-[#e01c2e] hover:bg-[#c4192a] disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-xl transition-all shadow-[0_4px_20px_rgba(224,28,46,0.25)]">
        {{ loading() ? 'Verificando...' : 'Entrar al panel' }}
      </button>

      <!-- Enlace inferior -->
      <div class="mt-5 text-center">
        <a routerLink="/" class="text-xs text-[#4b5563] hover:text-[#8b95a3] transition-colors inline-flex items-center gap-1.5">
          Volver al listado de campeonatos
        </a>
      </div>

    </div>
  </div>
</section>
